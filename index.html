<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AuraTune - 感情や風景から音をディグる</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AuraTune">
  
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto space-y-4">

  <!-- ヘッダー -->
  <header class="flex items-center justify-between py-3 border-b border-gray-800">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center text-white font-bold text-sm">🎶</div>
      <h1 class="text-lg font-bold tracking-wider bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">AuraTune</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleApiKeyModal()" class="text-xs bg-gray-800 border border-gray-700 hover:bg-gray-700 px-2.5 py-1 rounded-lg text-gray-300">
        ⚙️ API設定
      </button>
      <span class="text-xs px-2 py-0.5 rounded-full bg-purple-900/60 text-purple-300 border border-purple-700/50">AI READY</span>
    </div>
  </header>

  <!-- APIキー設定モーダル -->
  <div id="apiModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 w-full max-w-sm space-y-4">
      <h3 class="font-bold text-sm text-purple-400">Gemini API Key 設定</h3>
      <p class="text-xs text-gray-400">Google AI Studioで取得したAPI Keyを入力すると、AIによるリアルタイム楽曲解析が有効になります。</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full p-2.5 bg-black border border-gray-800 rounded-xl text-xs focus:outline-none focus:border-purple-500 text-gray-200">
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="toggleApiKeyModal()" class="px-3 py-1.5 text-xs text-gray-400 hover:text-white">キャンセル</button>
        <button onclick="saveApiKey()" class="px-4 py-1.5 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold rounded-lg">保存</button>
      </div>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <main class="space-y-4">
    <div class="space-y-1 text-center">
      <h2 class="text-xl font-bold tracking-tight">感情または風景から <span class="text-purple-400">音を掘り出す</span></h2>
      <p class="text-xs text-gray-400">写真や気分から、AIがJ-POP・洋楽・K-POP・ヒップホップ・アングラ等からおすすめを5曲提案します。</p>
    </div>

    <!-- アップロードエリア -->
    <div class="space-y-2">
      <div class="flex justify-between text-xs text-gray-400 px-1">
        <span>01. ビジュアルインプット</span>
        <span>写真 / カメラ</span>
      </div>
      <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed border-gray-700 rounded-2xl cursor-pointer bg-gray-900/40 hover:bg-gray-800/50 transition relative overflow-hidden">
        <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover opacity-60" alt="Preview">
        <div class="flex flex-col items-center justify-center py-3 z-10">
          <div class="w-7 h-7 mb-1 rounded-full bg-purple-600/20 text-purple-400 flex items-center justify-center text-xs">
            ☁️
          </div>
          <p id="uploadText" class="text-xs text-gray-400"><span class="font-semibold text-purple-400">タップして写真選択</span></p>
        </div>
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImage(event)">
      </label>
    </div>

    <!-- テキストインプットエリア -->
    <div class="space-y-2">
      <div class="flex justify-between text-xs text-gray-400 px-1">
        <span>02. 気分・感情インプット</span>
        <span>テキスト / タグ</span>
      </div>
      <input type="text" id="moodInput" placeholder="例: 気分が上がる曲、深夜ドライブ、エモい洋楽..." value="気分が上がる曲" class="w-full p-3 bg-gray-900/80 border border-gray-800 rounded-xl text-sm focus:outline-none focus:border-purple-500 text-gray-200">
    </div>

    <!-- 検索ボタン -->
    <button id="searchBtn" onclick="analyzeAura()" class="w-full py-3.5 px-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-xl shadow-lg transition text-sm flex items-center justify-center gap-2">
      <span id="btnIcon">✨</span> <span id="btnText">この雰囲気で曲を探す（5曲提案）</span>
    </button>

    <!-- 結果リスト表示エリア（最大5曲） -->
    <div id="songResultsContainer" class="hidden space-y-3">
      <h3 class="text-xs font-semibold text-purple-400 tracking-wider px-1">RECOMMENDED TRACKS (5 SONGS)</h3>
      <div id="tracksList" class="space-y-3">
        <!-- 動的に5曲がここに挿入されます -->
      </div>
    </div>
  </main>

  <footer class="text-center py-2 text-[10px] text-gray-600">
    &copy; 2026 AuraTune
  </footer>

  <script>
    let base64Image = null;

    window.onload = function() {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
      }
    };

    function toggleApiKeyModal() {
      document.getElementById('apiModal').classList.toggle('hidden');
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('gemini_api_key', key);
      toggleApiKeyModal();
      alert('APIキーを保存しました！');
    }

    function handleImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById('imagePreview');
          preview.src = e.target.result;
          preview.classList.remove('hidden');
          document.getElementById('uploadText').innerText = "写真選択済み";
          base64Image = e.target.result.split(',')[1];
        }
        reader.readAsDataURL(file);
      }
    }

    const fallbackDatabase = [
      { title: "アイドル", artist: "YOASOBI", genre: "J-POP", bpm: "166", desc: "圧倒的な疾走感とキャッチーなメロディ。気分を最高潮に上げる大ヒットトラック。" },
      { title: "怪獣の花唄", artist: "Vaundy", genre: "J-POP / Rock", bpm: "150", desc: "エモーショナルなボーカルと爽快なドライブ感のあるロックサウンド。" },
      { title: "Supernova", artist: "aespa", genre: "K-POP", bpm: "125", desc: "重厚なベースと先進的なサウンドデザインが魅力的なアッパーチューン。" },
      { title: "Blinding Lights", artist: "The Weeknd", genre: "洋楽 / Synthpop", bpm: "171", desc: "80s感あふれるシンセサウンドとレトロフューチャーな疾走感。" },
      { title: "Awake", artist: "tohji", genre: "J-HipHop", bpm: "135", desc: "独特の浮遊感とパワフルなビートが交差するアッパーチューン。" },
      { title: "ephemeral", artist: "lilbesh ramko", genre: "Hyperpop", bpm: "170", desc: "エモーショナルな旋律と疾走感ある最先端ハイパーポップ。" }
    ];

    async function analyzeAura() {
      const apiKey = localStorage.getItem('gemini_api_key');
      const moodText = document.getElementById('moodInput').value;

      setLoading(true);

      if (apiKey) {
        try {
          const tracks = await fetchGeminiRecommendations(apiKey, moodText, base64Image);
          renderTracks(tracks);
        } catch (error) {
          console.error("AI Error:", error);
          alert("AI解析でエラーが発生したため、通常の検索結果を表示します。");
          renderFallback();
        }
      } else {
        setTimeout(() => {
          renderFallback();
        }, 600);
      }

      setLoading(false);
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('searchBtn');
      if (isLoading) {
        btn.disabled = true;
        document.getElementById('btnIcon').innerText = "⏳";
        document.getElementById('btnText').innerText = "AIがバイブスを解析中...";
      } else {
        btn.disabled = false;
        document.getElementById('btnIcon').innerText = "✨";
        document.getElementById('btnText').innerText = "この雰囲気で曲を探す（5曲提案）";
      }
    }

    async function fetchGeminiRecommendations(apiKey, textPrompt, imageBase64) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

      const prompt = `あなたはセンス抜群の音楽ディガーです。
以下の入力（画像および/または気分テキスト：「${textPrompt}」）の雰囲気に完全にマッチするおすすめの楽曲を【必ず5曲】提案してください。
対象ジャンル: J-POP, 洋楽, K-POP, ヒップホップ, アングラ, ハイパーポップなど全般。

回答は以下の純粋なJSON配列フォーマット（Markdown記法なし）のみで返してください:
[
  {
    "title": "曲名",
    "artist": "アーティスト名",
    "genre": "ジャンル",
    "bpm": "推定BPM",
    "desc": "この雰囲気や写真に選曲された理由（1〜2文）"
  }
]`;

      const contents = [{
        parts: [{ text: prompt }]
      }];

      if (imageBase64) {
        contents[0].parts.push({
          inline_data: {
            mime_type: "image/jpeg",
            data: imageBase64
          }
        });
      }

      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents })
      });

      const data = await response.json();
      const rawText = data.candidates[0].content.parts[0].text;
      const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      return JSON.parse(cleanJson);
    }

    function renderTracks(tracks) {
      const container = document.getElementById('tracksList');
      container.innerHTML = '';

      tracks.slice(0, 5).forEach((track, index) => {
        const card = document.createElement('div');
        card.className = "bg-gray-900/90 p-3.5 rounded-xl border border-purple-900/40 shadow-md space-y-2";
        
        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-gray-800 pb-1.5">
            <span class="text-[10px] font-bold text-purple-400">#0${index + 1} • ${track.genre || 'Music'}</span>
            <span class="text-[10px] bg-purple-900/50 text-purple-300 px-2 py-0.5 rounded">BPM: ${track.bpm || '--'}</span>
          </div>
          <div class="space-y-0.5">
            <div class="font-bold text-sm text-white">${track.title}</div>
            <div class="text-xs text-gray-400">${track.artist}</div>
          </div>
          <p class="text-[11px] text-gray-300 bg-black/40 p-2 rounded-lg border border-gray-800/80">
            ${track.desc}
          </p>
          <!-- サブスクリンクボタン群（Apple Music / Spotify / LINE MUSIC） -->
          <div class="grid grid-cols-3 gap-1.5 pt-1">
            <button onclick="openStreaming('apple', '${track.title}', '${track.artist}')" class="py-2 bg-gray-800 hover:bg-gray-700 text-[10px] font-semibold rounded-lg text-center transition flex items-center justify-center gap-1 text-white">
              <span></span> Apple
            </button>
            <button onclick="openStreaming('spotify', '${track.title}', '${track.artist}')" class="py-2 bg-emerald-950/60 border border-emerald-800/50 hover:bg-emerald-900/60 text-[10px] font-semibold rounded-lg text-center transition flex items-center justify-center gap-1 text-emerald-300">
              <span>💚</span> Spotify
            </button>
            <button onclick="openStreaming('line', '${track.title}', '${track.artist}')" class="py-2 bg-green-950/60 border border-green-800/50 hover:bg-green-900/60 text-[10px] font-semibold rounded-lg text-center transition flex items-center justify-center gap-1 text-green-300">
              <span>💬</span> LINE
            </button>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('songResultsContainer').classList.remove('hidden');
    }

    function renderFallback() {
      const shuffled = [...fallbackDatabase].sort(() => 0.5 - Math.random());
      renderTracks(shuffled.slice(0, 5));
    }

    // 各サブスクの検索ページを開く処理
    function openStreaming(platform, trackName, artistName) {
      const query = encodeURIComponent(`${artistName} ${trackName}`);
      let url = '';

      if (platform === 'apple') {
        url = `https://music.apple.com/jp/search?term=${query}`;
      } else if (platform === 'spotify') {
        url = `https://open.spotify.com/search/${query}`;
      } else if (platform === 'line') {
        url = `https://music.line.me/search/search?query=${query}`;
      }

      window.open(url, '_blank');
    }
  </script>
</body>
</html>

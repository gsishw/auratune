<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AuraTune - 感情や風景から音をディグる</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AuraTune">
  
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

  <!-- ヘッダー -->
  <header class="flex items-center justify-between py-3 border-b border-gray-800">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center text-white font-bold text-sm">🎶</div>
      <h1 class="text-lg font-bold tracking-wider bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">AuraTune</h1>
    </div>
    <span class="text-xs px-2 py-0.5 rounded-full bg-purple-900/60 text-purple-300 border border-purple-700/50">BETA</span>
  </header>

  <!-- メインコンテンツ -->
  <main class="my-auto space-y-6 py-4">
    <div class="space-y-2 text-center">
      <h2 class="text-xl font-bold tracking-tight">感情または風景から<span class="text-purple-400">音を掘り出す</span></h2>
      <p class="text-xs text-gray-400">写真または今の気分を入力してください。AIが雰囲気を解析し、普段出会えないインディーズ・アングラ名曲を提案します。</p>
    </div>

    <!-- アップロードエリア -->
    <div class="space-y-2">
      <div class="flex justify-between text-xs text-gray-400 px-1">
        <span>01. ビジュアルインプット</span>
        <span>写真 / カメラ</span>
      </div>
      <label class="flex flex-col items-center justify-center w-full h-36 border-2 border-dashed border-gray-700 rounded-2xl cursor-pointer bg-gray-900/40 hover:bg-gray-800/50 transition">
        <div class="flex flex-col items-center justify-center pt-5 pb-6">
          <div class="w-10 h-10 mb-2 rounded-full bg-purple-600/20 text-purple-400 flex items-center justify-center">
            ☁️
          </div>
          <p class="text-xs text-gray-400"><span class="font-semibold text-purple-400">タップして写真を選択</span> または撮影</p>
        </div>
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImage(event)">
      </label>
    </div>

    <!-- プレビューと結果表示エリア -->
    <div id="resultArea" class="hidden space-y-4">
      <div id="previewContainer" class="w-full h-40 rounded-xl overflow-hidden bg-black border border-gray-800 relative">
        <img id="imagePreview" class="w-full h-full object-cover" alt="Selected">
      </div>
      
      <button onclick="analyzeAura()" class="w-full py-3 px-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-xl shadow-lg transition text-sm">
        この雰囲気で曲を探す ✨
      </button>
    </div>

    <!-- 検索結果（仮モック・AI提案用） -->
    <div id="songResult" class="hidden space-y-3 bg-gray-900/80 p-4 rounded-xl border border-gray-800">
      <h3 class="text-xs font-semibold text-purple-400 tracking-wider">RECOMMENDED TRACK</h3>
      <div class="space-y-1">
        <div id="trackTitle" class="font-bold text-base">---</div>
        <div id="artistName" class="text-xs text-gray-400">---</div>
      </div>
      <div class="flex gap-2 pt-2">
        <button id="appleMusicBtn" class="flex-1 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-semibold rounded-lg text-center transition">
           Apple Musicで聴く
        </button>
      </div>
    </div>
  </main>

  <!-- フッター -->
  <footer class="text-center py-2 text-[10px] text-gray-600">
    &copy; 2026 AuraTune
  </footer>

  <script>
    function handleImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('imagePreview').src = e.target.result;
          document.getElementById('resultArea').classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    function analyzeAura() {
      // 解析中のモック動作 ＆ サンプルとしてアングラ・インディーズ枠の曲を設定
      const mockTracks = [
        { title: "ephemeral", artist: "lilbesh ramko" },
        { title: "Awake", artist: "tohji" },
        { title: "fade away", artist: "Kegøn" }
      ];
      const selected = mockTracks[Math.floor(Math.random() * mockTracks.length)];

      document.getElementById('trackTitle').innerText = selected.title;
      document.getElementById('artistName').innerText = selected.artist;
      document.getElementById('songResult').classList.remove('hidden');

      // Apple Musicボタンに正確な検索リンクを紐づける
      const appleBtn = document.getElementById('appleMusicBtn');
      appleBtn.onclick = function() {
        openAppleMusic(selected.title, selected.artist);
      };
    }

    // 【修正版】Apple Musicで確実に検索・移行させる関数
    function openAppleMusic(trackName, artistName) {
      const query = encodeURIComponent(`${artistName} ${trackName}`);
      // Apple Musicの検索ディープリンクURL
      const appleMusicUrl = `https://music.apple.com/jp/search?term=${query}`;
      
      window.open(appleMusicUrl, '_blank');
    }
  </script>
</body>
</html>
